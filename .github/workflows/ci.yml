name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generated docs freshness
        run: task docs:check
      - name: Format check (gofmt)
        run: task format:check
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
      - name: Test
        run: task test:go
      - name: Build CLI
        run: task build:go
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  marketing:
    name: Marketing site (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: pnpm
          cache-dependency-path: marketing-site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: marketing-site
      - name: Audit dependencies
        run: task audit
      - name: Type-check site
        run: task typecheck:site
      - name: Lint site
        run: task lint:site
      - name: Test site
        run: task test:site
      - name: Build site
        run: task build:site
      - name: Check links
        run: task link:check
  evidence-app:
    name: Evidence app (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: pnpm
          cache-dependency-path: evidence-app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: evidence-app
      - name: Typecheck
        run: pnpm typecheck
        working-directory: evidence-app
      - name: Test
        run: pnpm test
        working-directory: evidence-app
      - name: Build
        run: pnpm build
        working-directory: evidence-app
      - name: Verify predictable bundle filenames
        # The Go CLI hardcodes references to /assets/evidence/v{ver}/_astro/main.{js,css}.
        # If vite.config.ts ever drops the entryFileNames override and starts
        # emitting hashed names, every published gallery would 404. Catch
        # that drift here.
        run: |
          test -f evidence-app/dist/_astro/main.js
          test -f evidence-app/dist/_astro/main.css
          if compgen -G "evidence-app/dist/_astro/*-*.js" > /dev/null; then
            echo "::error::found hashed JS files in dist/_astro; vite.config.ts must keep filenames stable"
            ls evidence-app/dist/_astro/
            exit 1
          fi
