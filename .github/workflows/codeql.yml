name: CodeQL

# Static security + quality analysis on Go (CLI) and JavaScript/TypeScript
# (marketing-site). Free on public repos.
#
# Triggers:
#   - push/PR to main: gates merges via the `main` branch ruleset
#   - weekly schedule: catches new advisories that affect already-merged code
#
# The matrix runs each language as its own job so a TS-only failure can't
# mask a Go finding (and vice versa). Both must pass for the
# "CodeQL" status check to be green at the workflow level.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 13:17 UTC — off the top of the hour to avoid GH runner contention.
    - cron: "17 13 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` adds the higher-recall security queries beyond
          # the default set; we accept the runtime cost for stronger coverage
          # on a public-facing CLI + site.
          queries: security-extended

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
